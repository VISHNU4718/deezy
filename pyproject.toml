[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deezy"
version = "0.1.0"
description = "Deezy - Personal AI Operator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "playwright>=1.40.0",
    "apscheduler>=3.11.0",
    "tzlocal>=5.0",
    "tzdata>=2024.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
windows = [
    "pywin32>=306",
]

[project.entry-points."console_scripts"]
deezy = "deezy.main:main"

[tool.setuptools.packages.find]
where = ["deezy"]
include = ["*"]